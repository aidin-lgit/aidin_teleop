name: docs-build-deployment

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Run deploy
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build site
        uses: ./.github/actions/build_site

      - name: Stage build output inside workspace
        shell: bash
        run: |
          rm -rf ./_site
          mkdir -p ./_site
          cp -R ${GITHUB_WORKSPACE}/../public/. ./_site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
