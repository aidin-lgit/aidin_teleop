# The main configuration file.
# Usable standalone for a fully functioning site
# or as base values for all other configurations.

# To use run `hugo` or `hugo server` from the `docs` directory

# default to localhost; the GitHub Pages baseURL is set in config/github/hugo.toml
baseURL = 'http://localhost:1313/'

# true -> rewrite all site-relative URLs (those with a leading slash) to be
# relative to the current content, so the site can be served from the file
# system as well as a webserver
relativeURLs = true

# true -> basic/index.html -> basic.html
uglyURLs = false

# Theme is loaded from the parent directory (this docs site lives inside the
# theme repo)
themesdir = '..'
theme = ''

# Korean-only manual site
defaultContentLanguage = 'ko'

# don't use any auto-generated summaries
summaryLength = 10

[outputs]
  # `print` - activate the themes feature to print whole chapters or leaf pages
  home = ['html', 'rss', 'print']
  section = ['html', 'rss', 'print']
  page = ['html', 'print']

[taxonomies]
  category = 'categories'
  tag = 'tags'
